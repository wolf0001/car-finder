<!DOCTYPE html>
<html>
<head>
    <title>Car Finder - Mark Position</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 85%; width: 100%; }
        .controls { height: 15%; display: flex; justify-content: center; align-items: center; gap: 15px; background: #f8f9fa; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        #btn-mark { background-color: #007bff; }
        #btn-share { background-color: #28a745; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="controls">
        <button id="btn-mark" onclick="markLocation()">Mark Car Position</button>
        <button id="btn-share" onclick="shareLocation()">Share Location</button>
    </div>

    <script>
        let map;
        let currentLocation = null;
        let activeMarker = null;

        function initMap() {
            const defaultLocation = { lat: 45.4215, lng: -75.6972 }; 
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 16,
                center: defaultLocation,
                mapTypeControl: false
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    map.setCenter(currentLocation);
                });
            }
        }

        function markLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    
                    map.setCenter(currentLocation);

                    if (activeMarker) { activeMarker.setMap(null); }

                    // Uses classic, universal marker pin setup
                    activeMarker = new google.maps.Marker({
                        position: currentLocation,
                        map: map,
                        title: "Your Parked Car"
                    });

                    alert("Car position locked onto your GPS coordinates!");
                });
            } else {
                alert("Geolocation is not supported or permitted.");
            }
        }

        function shareLocation() {
            if (!currentLocation) {
                alert("Please click 'Mark Car Position' first!");
                return;
            }

            const shareUrl = `${window.location.origin}/www/viewer.html?lat=${currentLocation.lat}&lng=${currentLocation.lng}`;

            const tempInput = document.createElement('input');
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            alert("Location tracking link successfully copied to your clipboard!");
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCkv39b6FOVEwHhhvOslU9SZ12_iu9931I&callback=initMap" async defer></script>
</body>
</html>
